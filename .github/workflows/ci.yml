name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      artifact: game-ci-${{ github.run_id }}-${{ github.run_attempt }}
