name: Issue keys and branches

on:
  issues:
    types: [opened, edited, reopened, transferred]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер Issue; залиште порожнім, щоб обробити всі Issues'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/issues/**'
      - '.github/workflows/issue-naming.yml'

permissions:
  contents: read

concurrency:
  group: issue-naming-${{ github.event.issue.number || inputs.issue_number || github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  test:
    name: Test issue naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/issues/test/sync.test.cjs

  sync:
    name: Set TMN key and linked branch
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Normalize titles and create linked branches
        run: node .github/issues/sync.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
